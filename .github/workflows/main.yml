name: Build iOS App

on: 
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app
      - name: Build project
        run: |
          xcodebuild build \
            -project Flowy.xcodeproj \
            -scheme Flowy \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Archive project
        run: |
          xcodebuild archive \
            -project Flowy.xcodeproj \
            -scheme Flowy \
            -destination 'generic/platform=iOS' \
            -archivePath build/Flowy.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Flowy.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r Flowy.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flowy-unsigned-ipa
          path: build/Flowy.ipa